name: vinyl_solutions
description: "A local-first virtual vinyl record library built with Flutter (Windows)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  just_audio: ^0.9.40
  just_audio_media_kit: ^2.0.5
  media_kit_libs_windows_audio: ^1.0.9
  http: ^1.2.2
  xml: ^6.5.0
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  pdfrx: ^1.0.0
  cryptography: ^2.7.0
  window_manager: ^0.4.2
  auto_updater: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
